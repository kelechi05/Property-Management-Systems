<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Property Management System - Account Management">
    <title>{% block head_title %}Property Management - Accounts{% endblock %}</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1655f2;
            --primary-dark: #000082;
            --accent: #ffe600;
            --surface: #ffffff;
            --surface-muted: #f5f7fb;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 14px 34px rgba(17, 24, 39, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: 'Manrope', 'Segoe UI', Tahoma, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #f7fafc 0%, #f0f4f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .account-form {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
        }

        .account-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .account-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 8px;
            letter-spacing: -0.01em;
        }

        .account-header p {
            font-size: 14px;
            color: var(--muted);
            margin: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        form > div {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        form label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"] {
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            color: var(--text);
            background: var(--surface-muted);
            transition: all 0.2s ease;
        }

        form input[type="text"]:focus,
        form input[type="email"]:focus,
        form input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(22, 85, 242, 0.1);
        }

        form input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
            margin-right: 6px;
        }

        form input[type="checkbox"] + label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-weight: 500;
            cursor: pointer;
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .form-actions a {
            color: var(--primary);
            font-weight: 600;
            transition: color 0.2s ease;
            text-decoration: none;
        }

        .form-actions a:hover {
            color: var(--primary-dark);
        }

        form button[type="submit"] {
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(22, 85, 242, 0.3);
            font-family: 'Manrope', sans-serif;
        }

        form button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 85, 242, 0.4);
        }

        form button[type="submit"]:active {
            transform: translateY(0);
        }

        .account-form > p {
            font-size: 14px;
            color: var(--muted);
            text-align: center;
            margin: 16px 0 0;
        }

        .account-form > p a {
            color: var(--primary);
            font-weight: 600;
            transition: color 0.2s ease;
            text-decoration: none;
        }

        .account-form > p a:hover {
            color: var(--primary-dark);
        }

        .errorlist {
            list-style: none;
            padding: 12px 14px;
            margin: 0;
            background: rgba(239, 68, 68, 0.1);
            border: 1.5px solid #fca5a5;
            border-radius: 10px;
            color: #991b1b;
            font-size: 13px;
            font-weight: 500;
        }

        .errorlist li {
            margin: 0;
        }

        .errorlist li + li {
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .account-form {
                padding: 32px 24px;
            }

            .account-header h1 {
                font-size: 24px;
            }

            .form-actions {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
